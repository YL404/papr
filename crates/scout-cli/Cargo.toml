[package]
name = "scout-cli"
version = "0.16.0"
edition = "2021"
description = "scout — an agent-facing CLI over your Scout RSS feeds: read, search, triage and refresh from the shell."

[[bin]]
name = "scout"
path = "src/main.rs"

[dependencies]
scout-core = { path = "../scout-core" }
rusqlite.workspace = true
reqwest.workspace = true
tokio.workspace = true
chrono.workspace = true
clap.workspace = true
serde_json.workspace = true
toon-format.workspace = true
